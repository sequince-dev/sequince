[workspace]
name = "sequince"
channels = ["conda-forge"]
requires-pixi = ">=0.78"
platforms = [
    "linux-64",
    "osx-arm64",
    { name = "linux-64-cuda12", platform = "linux-64", cuda = "12" },
    { name = "linux-64-cuda13", platform = "linux-64", cuda = "13" },
]

[dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.25.2"
scipy = ">=1.16"
matplotlib-base = ">=3.5"

[pypi-dependencies]
sequince = { path = ".", editable = true }

[environments]
default = { features = ["cpu", "py313", "test", "lint"], solve-group = "py313" }
py311 = ["cpu", "py311", "test"]
py312 = ["cpu", "py312", "test"]
py313 = { features = ["cpu", "py313", "test"], solve-group = "py313" }
all-backends = ["cpu", "py313", "test", "jax", "jax-cpu", "torch-cpu"]
docs = ["cpu", "py313", "doc"]
jax = ["cpu", "py313", "test", "jax", "jax-cpu"]
jax-cuda12 = ["py313", "test", "cuda12", "jax", "jax-gpu", "jax-cuda12"]
jax-cuda13 = ["py313", "test", "cuda13", "jax", "jax-gpu", "jax-cuda13"]
torch = ["cpu", "py313", "test", "torch-cpu"]
cupy-cuda12 = ["py313", "test", "cuda12", "cupy"]
cupy-cuda13 = ["py313", "test", "cuda13", "cupy"]
torch-cuda12 = ["py313", "test", "cuda12", "torch-gpu"]
torch-cuda13 = ["py313", "test", "cuda13", "torch-gpu"]
cuda12 = ["py313", "test", "cuda12", "cupy", "torch-gpu", "jax", "jax-gpu", "jax-cuda12"]
cuda13 = ["py313", "test", "cuda13", "cupy", "torch-gpu", "jax", "jax-gpu", "jax-cuda13"]

[feature.cpu]
platforms = ["linux-64", "osx-arm64"]

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

# Backend dependencies are separate so CPU environments do not require CUDA.
[feature.test.dependencies]
pytest = ">=7"
pytest-cov = ">=4"
corner = "*"
emcee = ">=3"
h5py = ">=3"

[feature.test.tasks]
test = "python -m pytest"
test-backends = "python -m pytest tests/test_array_api.py tests/test_array_backends.py"

[feature.lint.dependencies]
ruff = "0.14.*"
mypy = ">=1.10"
pre-commit = "*"

[feature.lint.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy"

[feature.doc.dependencies]
sphinx = ">=7.2"
sphinx-book-theme = ">=1.1"

[feature.doc.tasks]
# Runtime dependencies are installed here; mocking NumPy breaks orng's types.
docs = "sphinx-build -b html -D autodoc_mock_imports= docs docs/_build/html"

[feature.jax.pypi-dependencies]
jax = ">0.5.3"
jaxlib = "*"
blackjax = ">=1.2"

[feature.jax-cpu.activation.env]
JAX_PLATFORMS = "cpu"

# JAX supplies its runtime libraries through PyPI; the shared cuda-version
# metapackage selects the CUDA major version without installing a toolkit.
[feature.jax-cuda12.pypi-dependencies]
jax = { version = ">0.5.3", extras = ["cuda12"] }

[feature.jax-cuda13.pypi-dependencies]
jax = { version = ">0.5.3", extras = ["cuda13"] }

[feature.jax-gpu.activation.env]
# Require CUDA initialization while keeping CPU devices available explicitly.
JAX_PLATFORMS = "cuda,cpu"

[feature.jax-gpu.tasks]
check-jax = "python -c \"import jax; import jax.numpy as jnp; device = jax.devices('gpu')[0]; x = jax.device_put(jnp.arange(10), device); result = jax.jit(lambda a: jnp.sum(a * a))(x).block_until_ready(); assert result.device.platform == 'gpu'; assert int(result) == 285; print('JAX CUDA OK:', device)\""

[feature.torch-cpu.dependencies]
pytorch-cpu = "*"

# CUDA environments target NVIDIA GPUs on Linux. Pin the runtime separately
# from the driver capability declared on the CUDA platform.
[feature.cuda12]
platforms = ["linux-64-cuda12"]

[feature.cuda12.dependencies]
cuda-version = "12.*"

[feature.cuda13]
platforms = ["linux-64-cuda13"]

[feature.cuda13.dependencies]
cuda-version = "13.*"

[feature.cupy.dependencies]
cupy = "*"

[feature.cupy.tasks]
check-cupy = "python -c \"import cupy as cp; assert cp.cuda.runtime.getDeviceCount() > 0; x = cp.arange(10); assert int(cp.sum(x).get()) == 45; print('CuPy CUDA OK')\""

[feature.torch-gpu.dependencies]
pytorch-gpu = "*"

[feature.torch-gpu.tasks]
check-torch = "python -c \"import torch; assert torch.cuda.is_available(); x = torch.arange(10, device='cuda'); assert x.sum().item() == 45; print('PyTorch CUDA OK:', torch.cuda.get_device_name(0))\""
