[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sequince"
description = "Modular, composable Sequential Monte Carlo framework."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Michael J. Williams" }, { name = "Christian Chapman-Bird" }]
dependencies = [
    "scipy>=1.8",
    "matplotlib>=3.5",
    "numpy>=1.22",
    "emcee>=3.1",
]
dynamic = [
    "version"
]

[project.urls]
Homepage = "https://github.com/sequince-dev/sequince"
Repository = "https://github.com/sequince-dev/sequince"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sequince*"]

[tool.setuptools_scm]

[project.optional-dependencies]
minipcn = [
    "minipcn",
]
corner = [
    "corner",
]

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "corner",
]
dev = [
    "corner",
    "pre-commit",
    "mypy>=1.10",
    {include-group = "test"},

]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
extend-select = ["I"]

[tool.mypy]
python_version = "3.10"
packages = ["sequince"]
mypy_path = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
