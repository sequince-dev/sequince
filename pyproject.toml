[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sequince"
description = "Modular, composable Sequential Monte Carlo framework."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Michael J. Williams" }, { name = "Christian Chapman-Bird" }]
dependencies = [
    "acai-control>=0.1.0",
    "scipy>=1.16",
    "matplotlib>=3.5",
    "numpy>=1.25.2",
    # Proposal-state reuse is not yet available in a tagged release.
    "minipcn>=0.3.0",
    "array-api-compat>=1.13",
    "array-api-extra>=0.10",
    "optree>=0.19",
    "orng>=0.2.1",
]
dynamic = [
    "version"
]

[project.urls]
Homepage = "https://github.com/sequince-dev/sequince"
Repository = "https://github.com/sequince-dev/sequince"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sequince*"]

[tool.setuptools_scm]

[project.optional-dependencies]
jax = [
    "jax>0.5.3",
    "jaxlib"
]
blackjax = [
    "blackjax>=1.2",
]
emcee = [
    "emcee>=3.0",
]
eryn = [
    "eryn>=1.2.6",
    "numpy<2.4", # Eryn uses np.in1d, removed in NumPy 2.4.
]
corner = [
    "corner",
]
hdf5 = [
    "h5py>=3",
]

[dependency-groups]
test-core = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "corner",
    "emcee>=3.0",
    "h5py>=3",
]
test = [
    {include-group = "test-core"},
    "sequince[jax,blackjax,eryn]",
]
lint = [
    "pre-commit",
    "mypy>=1.10",
    "ruff==0.14.*",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
packages = ["sequince"]
mypy_path = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true

# Pixi reuses project dependencies, optional extras, and dependency groups above.
[tool.pixi.workspace]
channels = ["conda-forge"]
requires-pixi = ">=0.78"
platforms = [
    "linux-64",
    "osx-arm64",
    { name = "linux-64-cuda12", platform = "linux-64", cuda = "12" },
    { name = "linux-64-cuda13", platform = "linux-64", cuda = "13" },
]

[tool.pixi.pypi-dependencies]
sequince = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["cpu", "py313", "test-core", "lint"], solve-group = "py313" }
py311 = ["cpu", "py311", "test-core"]
py312 = ["cpu", "py312", "test-core"]
py313 = { features = ["cpu", "py313", "test-core"], solve-group = "py313" }
all-backends = ["cpu", "py313", "test-core", "jax", "blackjax", "jax-cpu", "torch-cpu", "eryn"]
eryn = ["cpu", "py313", "test-core", "eryn"]
docs = ["cpu", "py313", "doc"]
jax = ["cpu", "py313", "test-core", "jax", "blackjax", "jax-cpu"]
jax-cuda12 = ["py313", "test-core", "cuda12", "jax", "blackjax", "jax-gpu", "jax-cuda12"]
jax-cuda13 = ["py313", "test-core", "cuda13", "jax", "blackjax", "jax-gpu", "jax-cuda13"]
torch = ["cpu", "py313", "test-core", "torch-cpu"]
cupy-cuda12 = ["py313", "test-core", "cuda12", "cupy"]
cupy-cuda13 = ["py313", "test-core", "cuda13", "cupy"]
torch-cuda12 = ["py313", "test-core", "cuda12", "torch-gpu"]
torch-cuda13 = ["py313", "test-core", "cuda13", "torch-gpu"]
cuda12 = ["py313", "test-core", "cuda12", "cupy", "torch-gpu", "jax", "blackjax", "jax-gpu", "jax-cuda12"]
cuda13 = ["py313", "test-core", "cuda13", "cupy", "torch-gpu", "jax", "blackjax", "jax-gpu", "jax-cuda13"]

[tool.pixi.feature.cpu]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

# Backend dependencies are separate so CPU environments do not require CUDA.
[tool.pixi.feature.test-core.tasks]
test = "python -m pytest"
test-backends = "python -m pytest tests/test_array_api.py tests/test_array_backends.py"

[tool.pixi.feature.eryn.dependencies]
# Match the extra's bound in the conda solve when PyTorch brings in NumPy.
numpy = "<2.4"

[tool.pixi.feature.eryn.tasks]
test-eryn = "python -m pytest tests/test_mutation/test_eryn.py"

[tool.pixi.feature.lint.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy"

[tool.pixi.feature.doc.dependencies]
sphinx = ">=7.2"
sphinx-book-theme = ">=1.1"

[tool.pixi.feature.doc.tasks]
# Runtime dependencies are installed here; mocking NumPy breaks orng's types.
docs = "sphinx-build -b html -D autodoc_mock_imports= docs docs/_build/html"

[tool.pixi.feature.jax-cpu.activation.env]
JAX_PLATFORMS = "cpu"

# JAX supplies its runtime libraries through PyPI; the shared cuda-version
# metapackage selects the CUDA major version without installing a toolkit.
[tool.pixi.feature.jax-cuda12.pypi-dependencies]
jax = { version = "*", extras = ["cuda12"] }

[tool.pixi.feature.jax-cuda13.pypi-dependencies]
jax = { version = "*", extras = ["cuda13"] }

[tool.pixi.feature.jax-gpu.activation.env]
# Require CUDA initialization while keeping CPU devices available explicitly.
JAX_PLATFORMS = "cuda,cpu"

[tool.pixi.feature.jax-gpu.tasks]
check-jax = "python -c \"import jax; import jax.numpy as jnp; device = jax.devices('gpu')[0]; x = jax.device_put(jnp.arange(10), device); result = jax.jit(lambda a: jnp.sum(a * a))(x).block_until_ready(); assert result.device.platform == 'gpu'; assert int(result) == 285; print('JAX CUDA OK:', device)\""

[tool.pixi.feature.torch-cpu.dependencies]
pytorch-cpu = "*"

# CUDA environments target NVIDIA GPUs on Linux. Pin the runtime separately
# from the driver capability declared on the CUDA platform.
[tool.pixi.feature.cuda12]
platforms = ["linux-64-cuda12"]

[tool.pixi.feature.cuda12.dependencies]
cuda-version = "12.*"

[tool.pixi.feature.cuda13]
platforms = ["linux-64-cuda13"]

[tool.pixi.feature.cuda13.dependencies]
cuda-version = "13.*"

[tool.pixi.feature.cupy.dependencies]
cupy = "*"

[tool.pixi.feature.cupy.tasks]
check-cupy = "python -c \"import cupy as cp; assert cp.cuda.runtime.getDeviceCount() > 0; x = cp.arange(10); assert int(cp.sum(x).get()) == 45; print('CuPy CUDA OK')\""

[tool.pixi.feature.torch-gpu.dependencies]
pytorch-gpu = "*"

[tool.pixi.feature.torch-gpu.tasks]
check-torch = "python -c \"import torch; assert torch.cuda.is_available(); x = torch.arange(10, device='cuda'); assert x.sum().item() == 45; print('PyTorch CUDA OK:', torch.cuda.get_device_name(0))\""
