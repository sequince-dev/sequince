[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sequince"
description = "Modular, composable Sequential Monte Carlo framework."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Michael J. Williams" }, { name = "Christian Chapman-Bird" }]
dependencies = [
    "scipy>=1.16",
    "matplotlib>=3.5",
    "numpy>=1.22",
    "minipcn[array-api]>=0.2.0a4",
    "array-api-compat>=1.13",
    "array-api-extra>=0.10",
    "orng>=0.2.0a2",
]
dynamic = [
    "version"
]

[project.urls]
Homepage = "https://github.com/sequince-dev/sequince"
Repository = "https://github.com/sequince-dev/sequince"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sequince*"]

[tool.setuptools_scm]

[project.optional-dependencies]
jax = [
    "jax>0.5.3",
    "jaxlib"
]
blackjax = [
    "blackjax>=1.2",
]
emcee = [
    "emcee>=3.0",
]
corner = [
    "corner",
]
hdf5 = [
    "h5py>=3",
]

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "corner",
    "blackjax>=1.2",
    "emcee>=3.0",
    "h5py>=3",
    "jax>0.5.3",
    "jaxlib",
]
dev = [
    "pre-commit",
    "mypy>=1.10",
    {include-group = "test"},

]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
packages = ["sequince"]
mypy_path = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
